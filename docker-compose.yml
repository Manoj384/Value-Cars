version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: valuecars-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-valuecars}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valuecars_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-valuecars_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valuecars} -d ${POSTGRES_DB:-valuecars_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: valuecars-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: valuecars-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://valuecars:valuecars_secret_2026@postgres:5432/valuecars_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=super-secret-jwt-key-for-development-mode-value-cars-2026
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
  redis_data:
