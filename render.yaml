services:
  - type: web
    name: value-cars-platform
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      # Audit Fix B — keep the dev-only OTP stub disabled in production
      # (send-otp / verify-otp return 410 when false). Do not enable.
      - key: OTP_DEV_MODE
        value: "false"
      # Audit Fix F — set ONCE in the Render dashboard to seed the first admin,
      # then clear it so production never auto-recreates admin accounts.
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
